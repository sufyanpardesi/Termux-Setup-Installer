# SUFIYAN PARDESI INSTALLER - GENERIC SAFETY POLICY

INSTALL_HOME="${INSTALL_HOME:-$HOME/Sufiyan-Pardesi}"
DEV_HOME="${DEV_HOME:-$HOME/Termux-Setup-Installer}"

# Standard sensitive directories; never modify or upload their contents.
PROTECTED_PATHS=(
    "$HOME/.ssh"
    "$HOME/.gnupg"
)

PRESERVE_EXISTING_INSTALLATIONS=1
PRESERVE_EXISTING_USER_DATA=1
ALLOW_PROJECT_RELOCATION=0
ALLOW_AUTOMATIC_DELETION=0
BACKUP_BEFORE_MODIFICATION=1
DETECT_EXISTING_SOFTWARE=1
REUSE_COMPATIBLE_INSTALLATIONS=1
VERIFY_AFTER_INSTALLATION=1
